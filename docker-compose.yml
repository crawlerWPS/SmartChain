# SCFS 供应链金融智能风控与尽调辅助平台 - 一体化部署编排
# 对应 RFC 1.3 部署拓扑 / RFC 6.2 阶段 0 S0-4

services:
  # 1. PostgreSQL 数据库（5 schema）
  scfs-postgres:
    image: postgres:15
    container_name: scfs-postgres
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: scfs_db
      POSTGRES_USER: scfs
      POSTGRES_PASSWORD: scfs123
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scfs -d scfs_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis 缓存/会话
  scfs-redis:
    image: redis:7-alpine
    container_name: scfs-redis
    platform: linux/amd64
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. MinIO 文件存储（S3 兼容）
  scfs-minio:
    image: minio/minio
    container_name: scfs-minio
    platform: linux/amd64
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: scfs
      MINIO_ROOT_PASSWORD: scfs123456
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5

  # 4. Mock 外部数据源服务（Python Flask）
  scfs-mock:
    build:
      context: ./scfs-mock-server
      dockerfile: Dockerfile
    container_name: scfs-mock
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "9002:9002"
    volumes:
      - mock-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 5. 后端业务应用（Spring Boot 3.x）
  scfs-app:
    build:
      context: ./scfs-backend
      dockerfile: scfs-app/src/main/resources/docker/Dockerfile
    container_name: scfs-app
    platform: linux/amd64
    restart: unless-stopped
    environment:
      DB_HOST: scfs-postgres
      DB_PORT: 5432
      DB_NAME: scfs_db
      DB_USER: scfs
      DB_PASSWORD: scfs123
      REDIS_HOST: scfs-redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://scfs-minio:9000
      MINIO_ACCESS_KEY: scfs
      MINIO_SECRET_KEY: scfs123456
      OCR_ENDPOINT: http://scfs-mock:9002
      JWT_SECRET: scfs-secret-key-must-be-at-least-256-bits-long-for-HS256-algorithm-2026
      SCFS_SECURITY_JWT_SECRET: scfs-secret-key-must-be-at-least-256-bits-long-for-HS256-algorithm-2026
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    depends_on:
      scfs-postgres:
        condition: service_healthy
      scfs-redis:
        condition: service_healthy
      scfs-minio:
        condition: service_healthy
      scfs-mock:
        condition: service_healthy

  # 6. 前端 React 静态托管 + 反向代理
  scfs-frontend:
    build:
      context: ./scfs-frontend
      dockerfile: Dockerfile
    container_name: scfs-frontend
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - scfs-app

volumes:
  pg-data:
  redis-data:
  minio-data:
  mock-data:
