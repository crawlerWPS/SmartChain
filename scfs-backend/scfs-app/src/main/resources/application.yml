server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: scfs-app
  profiles:
    active: dev

  # 数据源 - PostgreSQL 15
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:scfs_db}?currentSchema=schema_common,schema_graph,schema_verify,schema_preaudit,schema_risk&stringtype=unspecified
    username: ${DB_USER:scfs}
    password: ${DB_PASSWORD:scfs123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: ScfsHikariCP

  # Flyway 数据库版本化迁移
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: schema_common,schema_graph,schema_verify,schema_preaudit,schema_risk
    default-schema: schema_common
    create-schemas: true

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  # 文件上传
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB

  # 异步线程池
  task:
    execution:
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 200
        thread-name-prefix: scfs-async-

# MyBatis
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.scfs.**.entity
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

# SCFS 业务配置
scfs:
  # JWT 配置
  jwt:
    secret: ${JWT_SECRET:scfs-secret-key-must-be-at-least-256-bits-long-for-HS256-algorithm-2026}
    expiration-minutes: 30
    header: Authorization
    prefix: "Bearer "

  # MinIO 对象存储
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:scfs}
    secret-key: ${MINIO_SECRET_KEY:scfs123456}
    bucket-materials: scfs-materials
    bucket-reports: scfs-reports
    bucket-exports: scfs-exports
    presigned-expire-minutes: 15

  # OCR 服务
  ocr:
    endpoint: ${OCR_ENDPOINT:http://localhost:9003}
    timeout-ms: 30000
    retry: 1
    max-file-size-mb: 5

  # Drools 规则引擎
  drools:
    drl-base-path: classpath:/rules/
    scan-interval-ms: 60000

  # 双岗机制
  dual-control:
    enabled: true
    maker-checker-same-person-disabled: true

  # 数据保留策略（合规要求 ≥ 5年）
  retention:
    verify-report-days: 1825
    material-file-days: 1825
    audit-log-days: 1825
    rule-change-log-permanent: true

  # 文件上传白名单
  upload:
    allowed-extensions: pdf,jpg,jpeg,png,docx,xlsx
    max-size-mb: 50

  # 默认权重（RFC 默认 40/30/30）
  risk:
    default-supply-chain-weight: 40
    default-transaction-weight: 30
    default-material-weight: 30
    default-low-threshold: 85
    default-mid-threshold: 70
    default-high-threshold: 50

# 日志
logging:
  level:
    root: INFO
    com.scfs: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Actuator 健康检查
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Knife4j API 文档
knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-version: true
    enable-swagger-models: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 认证用户
      paths-to-match: /auth/**,/users/**,/roles/**,/menus/**
    - group: 融资申请
      paths-to-match: /applications/**,/materials/**
    - group: 供应链图谱
      paths-to-match: /graph/**
    - group: 真实性核验
      paths-to-match: /verify/**
    - group: 材料预审
      paths-to-match: /preaudit/**
    - group: 风险画像
      paths-to-match: /risk/**
    - group: 规则配置
      paths-to-match: /rules/**,/weights/**,/templates/**
    - group: 审计日志
      paths-to-match: /audit-logs/**
